<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Tracking | LogiTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Navigation -->
    <header class="glass sticky top-0 z-50 px-8 py-4 flex items-center relative">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-emerald-400 to-teal-600 p-2.5 rounded-xl shadow-lg shadow-emerald-200">
                <i data-lucide="package-search" class="text-white w-6 h-6"></i>
            </div>
            <span class="text-xl font-black tracking-tight text-emerald-950">Logi<span class="text-emerald-500">Track</span></span>
        </div>
        <nav class="hidden md:flex gap-8 absolute left-1/2 -translate-x-1/2">
            <a href="index.html" class="nav-item text-sm font-bold text-slate-500 hover:text-emerald-600">Dashboard</a>
            <a href="inventory.html" class="nav-item text-sm font-bold text-slate-500 hover:text-emerald-600">Inventory</a>
            <a href="shipment.html" class="nav-item active text-sm font-bold text-slate-500 hover:text-emerald-600">Shipments</a>
        </nav>
        <div class="flex items-center gap-4 ml-auto">
        </div>
    </header>

    <main class="flex-1 p-8 max-w-4xl mx-auto w-full space-y-8">
        <div class="bg-emerald-900 rounded-[2.5rem] p-10 text-white shadow-2xl shadow-emerald-200 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500 rounded-full blur-[80px] opacity-20"></div>
            <div class="relative z-10">
                <h2 class="text-3xl font-black mb-6">Track Shipment</h2>
                <div class="flex gap-2 bg-white/10 p-2 rounded-[1.5rem] border border-white/10 backdrop-blur-sm">
                    <input id="search-id" type="text" placeholder="Enter Tracking Number (TRX-...)" class="flex-1 bg-transparent border-none outline-none text-white placeholder:text-emerald-200/50 px-6 font-bold">
                    <button onclick="track()" class="bg-white text-emerald-900 px-8 py-3 rounded-2xl font-bold hover:bg-emerald-50 transition shadow-lg">
                        Track
                    </button>
                </div>
            </div>
        </div>

        <div id="track-display">
            <!-- Empty State -->
            <div class="glass-card p-12 rounded-[2.5rem] text-center border-dashed border-2 border-emerald-200">
                <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-300">
                    <i data-lucide="search" class="w-10 h-10"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-400">Ready to Track</h3>
                <p class="text-sm text-slate-300 mt-2">Enter a valid tracking number above to see details.</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const AUTH = "Bearer RahasiaTST2026";

        async function track() {
            const pid = document.getElementById('search-id').value;
            if(!pid) return alert("Masukkan nomor resi dulu!");

            const res = await fetch('https://18223042.tesatepadang.space/api/shipments/', { 
                headers: { "Authorization": AUTH } 
            });
            const data = await res.json();
            const s = data.find(i => i.tracking_number == pid);

            if(!s) return alert("Package Not Found!");

            const isDelivered = s.status === 'DELIVERED';

            document.getElementById('track-display').innerHTML = `
                <div class="bg-white rounded-[2.5rem] shadow-xl shadow-emerald-100 overflow-hidden animate-fade-in border border-emerald-50">
                    <!-- Ticket Header -->
                    <div class="bg-emerald-50 p-8 border-b border-emerald-100 flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Tracking Number</p>
                            <h2 class="text-3xl font-black text-emerald-900 tracking-tight">${s.tracking_number}</h2>
                        </div>
                        <div class="text-right">
                            <span class="px-4 py-2 rounded-full text-xs font-black uppercase ${isDelivered ? 'bg-emerald-500 text-white' : 'bg-amber-400 text-amber-950'}">
                                ${s.status}
                            </span>
                        </div>
                    </div>

                    <!-- Ticket Body -->
                    <div class="p-8 grid grid-cols-2 gap-8">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Current Location</p>
                            <p class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i data-lucide="map-pin" class="w-5 h-5 text-emerald-500"></i> ${s.current_location}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Courier Service</p>
                            <p class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i data-lucide="truck" class="w-5 h-5 text-emerald-500"></i> ${s.courier_name}
                            </p>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="p-8 bg-slate-50 border-t border-slate-100">
                        ${!isDelivered ? `
                            <p class="text-xs font-bold text-slate-400 uppercase mb-3">Update Status</p>
                            <div class="flex gap-3">
                                <input id="updLoc" type="text" placeholder="New City..." class="flex-1 bg-white border border-slate-200 p-3 rounded-xl outline-emerald-500 font-bold text-sm">
                                <button onclick="updateStatus(${s.id}, 'location')" class="bg-emerald-600 text-white px-4 rounded-xl font-bold hover:bg-emerald-700 transition text-sm">Update</button>
                                <button onclick="updateStatus(${s.id}, 'delivered')" class="bg-emerald-100 text-emerald-700 px-4 rounded-xl font-bold hover:bg-emerald-200 transition text-sm">
                                    <i data-lucide="check" class="w-4 h-4"></i>
                                </button>
                            </div>
                        ` : `
                            <div class="flex items-center gap-3 text-emerald-600 bg-emerald-100/50 p-4 rounded-xl">
                                <i data-lucide="check-circle" class="w-6 h-6"></i>
                                <div>
                                    <p class="font-bold text-sm">Package Delivered Successfully</p>
                                    <p class="text-xs opacity-70">No further actions required.</p>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        async function updateStatus(sid, type) {
            let payload = {};
            if(type === 'location') {
                const loc = document.getElementById('updLoc').value;
                if(!loc) return alert("Isi lokasi dulu!");
                payload = { current_location: loc };
            } else {
                payload = { status: 'DELIVERED' };
            }

            await fetch(`https://18223042.tesatepadang.space/api/shipments/${sid}/`, {
                method: 'PATCH',
                headers: { "Content-Type": "application/json", "Authorization": AUTH },
                body: JSON.stringify(payload)
            });
            track();
        }
    </script>
</body>
</html>
